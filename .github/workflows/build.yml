name: Build Jagoomba Color

on:
  push:
    branches:
      - master
      - feature/fullscreen-stretch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBGBA: /opt/devkitpro/libgba
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare fullscreen-safe linker layout
        shell: bash
        run: |
          bash tools/prepare_fullscreen_linker.sh
          grep -F $'ewram\t: ORIGIN = 0x02000000, LENGTH = 256K' src/gba_cart_fullscreen.ld
          grep -F $'vram1   : ORIGIN = 0x06013600, LENGTH = 2560' src/gba_cart_fullscreen.ld

      - name: Build generated asset objects
        shell: bash
        run: |
          set +e
          make -j2
          first_status=$?
          set -e
          test -f build/font.lz77.o
          test -f build/fontpal.bin.o
          cp build/font.lz77.o build/font.o
          cp build/fontpal.bin.o build/fontpal.o
          echo "First pass status: ${first_status}; generated objects prepared."

      - name: Link emulator
        run: make -j2

      - name: Validate fullscreen memory map
        shell: bash
        run: |
          set -euo pipefail
          NM="$DEVKITARM/bin/arm-none-eabi-nm"
          OBJDUMP="$DEVKITARM/bin/arm-none-eabi-objdump"

          "$OBJDUMP" -h jagoombacolor.elf > section-map.txt
          "$NM" -n jagoombacolor.elf > symbols.txt

          python3 - <<'PY'
          from pathlib import Path

          lines = Path("section-map.txt").read_text(encoding="utf-8").splitlines()
          sections = {}
          for index, line in enumerate(lines):
              fields = line.split()
              if len(fields) < 7 or not fields[0].isdigit():
                  continue
              name = fields[1]
              size = int(fields[2], 16)
              vma = int(fields[3], 16)
              flags = lines[index + 1].strip() if index + 1 < len(lines) else ""
              sections[name] = {"vma": vma, "size": size, "flags": flags}

          if ".vram1" not in sections:
              raise SystemExit("Missing .vram1 section")

          vram1 = sections[".vram1"]
          if vram1["vma"] != 0x06013600:
              raise SystemExit(
                  f".vram1 has unexpected VMA 0x{vram1['vma']:08X}"
              )
          if "CODE" not in vram1["flags"]:
              raise SystemExit(".vram1 is not marked executable")
          if vram1["size"] > 0x0A00:
              raise SystemExit(
                  f".vram1 exceeds the non-visible page-1 tail: 0x{vram1['size']:X}"
              )

          visible_start = 0x0600A000
          visible_end = 0x06013600
          page1_end = 0x06014000

          vram1_start = vram1["vma"]
          vram1_end = vram1_start + vram1["size"]
          if vram1_start < visible_end or vram1_end > page1_end:
              raise SystemExit(
                  ".vram1 is outside the safe non-visible page-1 tail: "
                  f"0x{vram1_start:08X}-0x{vram1_end:08X}"
              )

          overlaps = []
          for name, section in sections.items():
              if "CODE" not in section["flags"]:
                  continue
              start = section["vma"]
              end = start + section["size"]
              if start < visible_end and end > visible_start:
                  overlaps.append((name, start, section["size"]))

          if overlaps:
              formatted = ", ".join(
                  f"{name}@0x{start:08X}+0x{size:X}"
                  for name, start, size in overlaps
              )
              raise SystemExit(
                  "Executable code overlaps the visible Mode 4 page-1 framebuffer: "
                  + formatted
              )

          symbols = {}
          for line in Path("symbols.txt").read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if len(fields) >= 3:
                  try:
                      address = int(fields[0], 16)
                  except ValueError:
                      continue
                  symbols[fields[-1]] = address

          required = (
              "fullscreen_frame",
              "newframe_vblank",
              "fullscreen_original_newframe_vblank",
          )
          missing = [name for name in required if name not in symbols]
          if missing:
              raise SystemExit("Missing required symbols: " + ", ".join(missing))

          frame = symbols["fullscreen_frame"]
          if not (0x02000000 <= frame < 0x02040000):
              raise SystemExit(
                  f"fullscreen_frame outside EWRAM: 0x{frame:08X}"
              )

          print(
              f".vram1 at 0x{vram1_start:08X}-0x{vram1_end:08X}, "
              "after the visible Mode 4 framebuffer"
          )
          print(f"fullscreen_frame at 0x{frame:08X}")
          print("No executable section overlaps visible Mode 4 pixels.")
          PY

      - name: Show binary information
        run: |
          ls -l jagoombacolor.gba jagoombacolor.elf
          sha256sum jagoombacolor.gba
          cat section-map.txt
          "$DEVKITARM/bin/arm-none-eabi-nm" -n jagoombacolor.elf | grep -E 'fullscreen_frame|newframe_vblank|fullscreen_original_newframe_vblank'

      - name: Upload emulator binary
        uses: actions/upload-artifact@v4
        with:
          name: jagoombacolor-fullscreen
          path: |
            jagoombacolor.gba
            jagoombacolor.elf
            jagoombacolor.elf.map
            src/gba_cart_fullscreen.ld
            section-map.txt
            symbols.txt
          if-no-files-found: error
