name: Build Jagoomba Color

on:
  push:
    branches:
      - master
      - feature/fullscreen-stretch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBGBA: /opt/devkitpro/libgba
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare fullscreen-safe linker layout
        shell: bash
        run: |
          bash tools/prepare_fullscreen_linker.sh
          grep -F $'ewram\t: ORIGIN = 0x02000000, LENGTH = 252K' src/gba_cart_fullscreen.ld
          grep -F $'vram1   : ORIGIN = 0x0203F000, LENGTH = 4096' src/gba_cart_fullscreen.ld

      - name: Build generated asset objects
        shell: bash
        run: |
          set +e
          make -j2
          first_status=$?
          set -e
          test -f build/font.lz77.o
          test -f build/fontpal.bin.o
          cp build/font.lz77.o build/font.o
          cp build/fontpal.bin.o build/fontpal.o
          echo "First pass status: ${first_status}; generated objects prepared."

      - name: Link emulator
        run: make -j2

      - name: Validate fullscreen memory map
        shell: bash
        run: |
          set -euo pipefail
          READELF="$DEVKITARM/bin/arm-none-eabi-readelf"
          NM="$DEVKITARM/bin/arm-none-eabi-nm"
          OBJDUMP="$DEVKITARM/bin/arm-none-eabi-objdump"

          section_addr="$($READELF -W -S jagoombacolor.elf | awk '$3 == ".vram1" {print $5}')"
          test "$section_addr" = "0203f000"

          frame_addr="$($NM -n jagoombacolor.elf | awk '$3 == "fullscreen_frame" {print $1}')"
          test -n "$frame_addr"

          $OBJDUMP -h jagoombacolor.elf > section-map.txt
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("section-map.txt").read_text(encoding="utf-8").splitlines()
          sections = []
          for index, line in enumerate(lines):
              fields = line.split()
              if len(fields) < 7 or not fields[0].isdigit():
                  continue
              name = fields[1]
              size = int(fields[2], 16)
              vma = int(fields[3], 16)
              flags = lines[index + 1] if index + 1 < len(lines) else ""
              if "CODE" in flags:
                  sections.append((name, vma, size))

          framebuffer_start = 0x0600A000
          framebuffer_end = 0x06014000
          overlaps = [
              (name, address, size)
              for name, address, size in sections
              if address < framebuffer_end and address + size > framebuffer_start
          ]
          if overlaps:
              raise SystemExit(f"Executable code overlaps Mode 4 page 1: {overlaps}")
          print("No executable section overlaps Mode 4 page 1.")
          PY

      - name: Show binary information
        run: |
          ls -l jagoombacolor.gba jagoombacolor.elf
          sha256sum jagoombacolor.gba
          "$DEVKITARM/bin/arm-none-eabi-readelf" -W -S jagoombacolor.elf | grep -E '\.vram1|\.sbss|\.ewram'
          "$DEVKITARM/bin/arm-none-eabi-nm" -n jagoombacolor.elf | grep -E 'fullscreen_frame|newframe_vblank|fullscreen_original_newframe_vblank'

      - name: Upload emulator binary
        uses: actions/upload-artifact@v4
        with:
          name: jagoombacolor-fullscreen
          path: |
            jagoombacolor.gba
            jagoombacolor.elf
            jagoombacolor.elf.map
            src/gba_cart_fullscreen.ld
            section-map.txt
          if-no-files-found: error
